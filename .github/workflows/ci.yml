name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'

  pull_request:
    branches:
      - main
      - master

jobs:

  # =========================================================
  # BACKEND TESTS
  # =========================================================

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TESTING: "True"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      JWT_SECRET_KEY: ci_secret_key_for_testing_12345

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Run backend API tests
      - name: Run Backend API Tests
        run: |
          python -m pytest tests --ignore=tests/e2e -v