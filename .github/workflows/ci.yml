name: Continuous Integration

# Event: Tells GitHub WHEN to run this automation
on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

# Jobs: What steps to run
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull the latest repository code into the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run a simple test or script
      - name: Run Test Command
        run: |
          echo "GitHub Actions successfully executed!"
          python --version