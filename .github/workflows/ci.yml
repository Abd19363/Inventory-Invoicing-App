name: Continuous Integration

# Run CI when code is pushed to these branches
on:
  push:
    branches:
      - main
      - master
      - 'feature/*'

  # Run CI when a Pull Request is created/updated
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Run backend tests
      - name: Run Tests
        run: |
          pytest tests -v