name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TESTING: "True"
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: ci_secret_key_for_testing_12345

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run backend tests
      - name: Run Tests
        env:
          TESTING: "True"
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: ci_secret_key_for_testing_12345
        run: |
          python -m pytest tests -v