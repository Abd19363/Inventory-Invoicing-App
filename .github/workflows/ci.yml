name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'

  pull_request:
    branches:
      - main
      - master

jobs:

  # =========================================================
  # BACKEND TESTS
  # =========================================================

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TESTING: "True"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      JWT_SECRET_KEY: ci_secret_key_for_testing_12345

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # 4. Run backend API tests
      - name: Run Backend API Tests
        working-directory: ./backend
        run: |
          python -m pytest tests -v


  # =========================================================
  # FRONTEND TESTS
  # =========================================================

  frontend-tests:
    name: Frontend Quality Gates & Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Static Code Analysis (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests & Coverage Quality Gates
        working-directory: ./frontend
        run: npm run test:coverage


  # =========================================================
  # SELENIUM E2E TESTS
  # =========================================================

  selenium-e2e-tests:
    name: Selenium E2E Automation Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_e2e_test
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_e2e_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TESTING: "True"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_e2e_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_e2e_test
      JWT_SECRET_KEY: ci_e2e_secret_key_12345

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Start FastAPI Backend Server
        working-directory: ./backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Start Next.js Frontend Server
        working-directory: ./frontend
        run: |
          npm start &
          sleep 5

      - name: Run Selenium E2E Tests
        working-directory: ./backend
        run: |
          python -m pytest tests/e2e -v